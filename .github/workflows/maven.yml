name: Maven CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  test-on-push:
    if: github.event_name == 'push' && hashFiles('pom.xml') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"
      - name: Run tests only
        run: mvn -B test

  build-and-test-on-pr:
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && hashFiles('pom.xml') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"
      - name: Build and test
        run: mvn -B clean verify
