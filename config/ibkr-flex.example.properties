# Copy this file to config/ibkr-flex.properties and fill in your own values.
# Do not commit config/ibkr-flex.properties.
#
# IBKR setup checklist:
# 1. Log in to IBKR Client Portal.
# 2. Go to Reporting -> Flex Queries.
# 3. Create a saved Activity Flex Query, not a PDF statement download.
# 4. Set output format to XML.
# 5. Include the Trades section.
# 6. Include trade fields needed by the parser, currently:
#    accountId, assetCategory, symbol, description, conid, tradeDate,
#    settleDateTarget, buySell, quantity, tradePrice, proceeds,
#    ibCommission, currency, fifoPnlRealized.
# 7. Save the query and copy its Flex Query ID into ibkr.flex.query-id.
# 8. Enable Flex Web Service Configuration and copy the current token into
#    ibkr.flex.token.
#
# The code should compute request date ranges from TaxYear and pass them to
# IBKR as fd=yyyyMMdd and td=yyyyMMdd. Do not put tax-year dates in this file.

# IBKR Flex Web Service access token. This is secret.
ibkr.flex.token=

# Saved XML Activity Flex Query ID for the trades query.
ibkr.flex.query-id=

# Flex Web Service API version. Keep 3 unless IBKR changes the API.
ibkr.flex.version=3
